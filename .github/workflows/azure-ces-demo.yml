name: Build and deploy CES Azure demo

on:
  push:
    branches:
      - deploy/azure-ces-demo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-ces-demo
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/deploy/azure-ces-demo'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build standalone application
        # Synthetic build-only configuration; runtime settings belong in App Service.
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: build_placeholder
          DB_PASSWORD: build_placeholder
          DB_NAME: build_placeholder
          APP_TIME_ZONE: Asia/Manila
        run: npm run build

      - name: Assemble standalone deployment
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next/static
          cp -a .next/static/. .next/standalone/.next/static/
          if [ -d public ]; then
            mkdir -p .next/standalone/public
            cp -a public/. .next/standalone/public/
          fi
          # Next.js tracing can copy environment files; never ship them.
          find .next/standalone -name '.env*' -exec rm -rf -- {} +
          test -f .next/standalone/.next/BUILD_ID
          # Preserve traced runtime packages; lockfile dev flags alone are not a
          # safe reason to delete files from Next.js's runtime dependency graph.
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = '.next/standalone';
          const { devDependencies = {} } = require('./package.json');
          for (const dependency of Object.keys(devDependencies)) {
            if (fs.existsSync(path.join(root, 'node_modules', dependency))) {
              throw new Error(`Development dependency in artifact: ${dependency}`);
            }
          }
          for (const entry of ['app', 'components', 'docs', 'scripts', 'tests', '.git', '.github', 'tsconfig.json', 'next.config.ts']) {
            if (fs.existsSync(path.join(root, entry))) {
              throw new Error(`Source-only entry in artifact: ${entry}`);
            }
          }
          NODE

      - name: Verify relocated standalone deployment
        shell: bash
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: build_placeholder
          DB_PASSWORD: build_placeholder
          DB_NAME: build_placeholder
          APP_TIME_ZONE: Asia/Manila
        run: |
          set -euo pipefail
          deployment_dir=$(mktemp -d "$RUNNER_TEMP/ces-standalone.XXXXXX")
          # Match artifact upload's dereferencing of Turbopack package symlinks.
          cp -aL .next/standalone/. "$deployment_dir/"
          export EXPECTED_MYSQL2_VERSION
          EXPECTED_MYSQL2_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/mysql2'].version")
          cd "$deployment_dir"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          for (const name of ['mysql2/promise', 'argon2']) {
            const resolved = fs.realpathSync(require.resolve(name));
            assert(resolved.startsWith(process.cwd() + path.sep), `${name} resolved outside artifact`);
            require(name);
          }
          assert.equal(require('mysql2/package.json').version, process.env.EXPECTED_MYSQL2_VERSION);
          console.log('Standalone MySQL2 and Argon2 imports passed');
          NODE
          HOSTNAME=127.0.0.1 PORT=3100 node server.js > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if [ "$(curl --silent --max-time 5 --output login.html --write-out '%{http_code}' http://127.0.0.1:3100/login)" = 200 ]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done
          test "$(curl --fail --silent --max-time 5 --output login.html --write-out '%{http_code}' http://127.0.0.1:3100/login)" = 200
          grep -q 'Staff Sign In' login.html
          asset=$(find .next/static -type f -name '*.js' -print -quit)
          test -n "$asset"
          test "$(curl --fail --silent --max-time 5 --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3100/_next/${asset#.next/}")" = 200
          echo 'Standalone startup, login page and static asset checks passed'

      - name: Upload standalone deployment
        uses: actions/upload-artifact@v4
        with:
          name: ces-standalone
          path: .next/standalone/
          # Required for .next and traced hidden runtime files.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/deploy/azure-ces-demo'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download standalone deployment
        uses: actions/download-artifact@v4
        with:
          name: ces-standalone
          path: standalone

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # App Service: Linux/Node 24, startup `node server.js`, platform-supplied PORT.
      # Set SCM_DO_BUILD_DURING_DEPLOYMENT=false and ENABLE_ORYX_BUILD=false in Azure.
      - name: Deploy standalone application
        uses: azure/webapps-deploy@v3
        with:
          app-name: ces-portal-demo-2026
          slot-name: Production
          package: standalone
          startup-command: node server.js
